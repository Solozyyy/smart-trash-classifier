global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'ecosort-api'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['api:8000', 'host.docker.internal:8000']
        labels:
          service: 'ecosort-api'
          environment: 'production'
